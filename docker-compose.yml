# The benchmark stack. It shares a two-core box with two production sites and a live Supabase
# stack, and every limit below exists because of that - ADR-18, docs/deployment-target.md.

name: scanner-demo

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: scanner-demo-server:local
    restart: unless-stopped

    # Provider credentials and the bearer token come from the file, never from this manifest -
    # docker-compose.yml is committed and the repository is public.
    env_file:
      - server/.env

    environment:
      # Inside the container only. The loopback binding that matters is the one under `ports`.
      HOST: 0.0.0.0
      PORT: 3002
      # Each directory is its own named volume; phase 07 mounts the image one read-only into the
      # OCR sidecar, which is only possible if it is a volume in its own right.
      IMAGE_DIR: /data/images
      THUMB_DIR: /data/thumbs
      DATABASE_PATH: /data/db/scanner.sqlite
      # Resolved on the internal network below, which has no route out and no published port.
      OCR_SIDECAR_URL: http://ocr:9005
      # The path *inside* the container, so server/.env can hold the host path it was written with.
      # The file itself arrives through the read-only mount below and is never in an image layer.
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcv-service-account.json

    networks:
      # Both, and it has to be spelled out: naming any network at all opts a service out of the
      # default one, and the server needs that one for its published port and for the cloud
      # providers phases 08 and 09 call.
      - default
      - ocr

    depends_on:
      # Start order only - Compose has no readiness signal to wait for here, and the image ships no
      # health command that would not mean writing Python. The server's warm-up retries instead.
      - ocr

    ports:
      # Loopback only. Ports 80 and 443 belong to the box's production nginx, which terminates TLS
      # for scanner.yo-po.eu and proxies here - ADR-17. Publishing on 0.0.0.0 would expose an
      # unencrypted API to the internet.
      - '127.0.0.1:3002:3002'

    volumes:
      - scanner-images:/data/images
      - scanner-thumbs:/data/thumbs
      - scanner-db:/data/db
      # The Google service-account key, read-only, mounted rather than built in: a credential inside
      # an image layer survives every `docker save`, every registry push and every `docker history`.
      # The directory is gitignored and the file is created on the box - deploy/README.md.
      #
      # Bind mounts are created by Docker when they are missing, so a deployment without the key
      # gets an empty directory here and the Vision endpoint answers 502 with a message naming the
      # file. That is the intended failure: the sidecar and the on-device path go on working.
      - ./deploy/secrets:/run/secrets:ro

    # Both limits, not just the CPU one. The box has no swap and the largest resident process on it
    # is production Postgres; an unbounded container that grows takes down the thing this benchmark
    # is a guest of, rather than merely itself - ADR-18.
    cpus: 1.5
    mem_limit: 512m
    mem_reservation: 128m

    # 20 GB free on the box, and an unrotated container log is a slow way to consume all of it.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # The self-hosted OCR engine - RapidOCR, which is PaddleOCR's models converted to ONNX, wrapped in
  # a FastAPI server. A pre-built black box, configured from the outside and never opened: no Python
  # is written here or anywhere else in this repository.
  #
  # Everything below was measured rather than assumed - docs/spikes/07-ocr-sidecar.md.
  ocr:
    # Pinned by digest, never by tag. There is no official image for this package; this is one
    # person's build, and the pin buys reproducibility rather than trust. The models are pinned
    # separately by the config above, so a replacement image is comparable rather than a fresh
    # baseline - spike § 1.
    image: qingchen0607/rapid-ocr-api@sha256:a1445b36179ec4218740035b5688c50b40ed46f576b394e95e9582ec44be966c
    restart: unless-stopped

    # One worker, against the image's own default of two. Each worker loads its own copy of the
    # models, so the second costs 334 MiB - the difference between 978 MiB and 644 MiB resident -
    # and buys nothing: 1.854 s against 1.922 s median, inside the noise. The app runs one method at
    # a time by design, so there is no concurrency for a second worker to serve; two simultaneous
    # requests measured *worse* than serialising them - spike §§ 4, 5.
    command: ['bash', '-c', 'rapidocr_api -ip 0.0.0.0 -p 9005 -workers 1']

    # The image runs as root and does not have to. Verified working as 1000:1000, which is also the
    # UID that owns the image files the server writes - deploy/README.md.
    user: '1000:1000'

    # Verified working with nothing writable at all. `rapidocr_api` reads models and writes nothing.
    read_only: true
    tmpfs:
      # ONNX Runtime and the multipart parser both want a scratch directory. Small and in memory, so
      # a read-only root filesystem costs nothing operationally.
      - /tmp:size=64m

    networks:
      # Internal, with no `ports:` anywhere in this service. The container is unreachable from the
      # host and from the internet, and has no route out itself - which the spike used to prove the
      # models load from inside the image rather than being downloaded at run time.
      - ocr

    volumes:
      # Read-only, and **presently unused as a transport**. The engine accepts an HTTP upload or a
      # base64 string and has no path parameter at all, so the server reads the bytes and posts
      # them - spike §§ 2, 3. The mount stays because the specification asks for it, because it
      # costs nothing, and because it is the difference between a one-line change and a
      # redeployment if a future image ever accepts a path. It is not load-bearing today.
      - scanner-images:/data/images:ro
      - ./deploy/rapidocr/config.yaml:/usr/local/lib/python3.10/site-packages/rapidocr/config.yaml:ro

    # The same two limits as the server, for the same reason - ADR-18. `mem_limit` is 1g against a
    # measured peak of 644 MiB (VmHWM 626 MiB); 768m was judged too tight to absorb a larger image.
    #
    # The sum of the two `cpus:` exceeds the box's two cores on purpose: the server is idle while
    # the sidecar infers and vice versa, so the overcommit costs nothing on this workload and
    # capping either at 1.0 would cost 55 % latency - spike § 4.
    cpus: 1.5
    mem_limit: 1g
    mem_reservation: 256m

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  # The default bridge, named explicitly because the server now opts out of implicit membership.
  default:

  # No route to the internet and no route in. `docker compose ps` shows the sidecar with no
  # published ports, and a curl from the host cannot reach it - phase 07 criterion 4.
  ocr:
    internal: true

volumes:
  scanner-images:
  scanner-thumbs:
  scanner-db:
