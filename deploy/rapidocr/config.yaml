# RapidOCR's own configuration, mounted read-only over the one packaged inside the image.
#
# It is a byte-for-byte copy of
# `/usr/local/lib/python3.10/site-packages/rapidocr/config.yaml` from
# `qingchen0607/rapid-ocr-api@sha256:a1445b36…` (rapidocr 3.2.0), with exactly two values changed -
# the thread counts under `EngineConfig.onnxruntime`. Everything else is the image's own default and
# is left alone deliberately, so a diff against the packaged file shows the whole of our
# intervention.
#
# **Re-extract this file in the same commit that changes the image digest.** It is version-coupled:
# `rapidocr_api` never passes a `config_path`, so `RapidOCR()` loads whatever sits at that path, and
# a config from one version silently mounted over another is a misconfiguration nothing reports.
# The extraction is:
#
#   docker create --name probe qingchen0607/rapid-ocr-api@sha256:<digest>
#   docker cp probe:/usr/local/lib/python3.10/site-packages/rapidocr/config.yaml .
#   docker rm probe
#
# Why the file is mounted at all, when the spike measured the defaults as fine on the deployment
# box - docs/spikes/07-ocr-sidecar.md § 8:
#
#   ONNX Runtime's `-1` means "size the thread pool from the core count", and `nproc` inside a
#   container started with `--cpus=1.5` still reports the **host's** cores, not the cgroup's share.
#   On the two-core VPS that resolves to 2 and is invisible. On a 32-core machine it resolves to 32
#   threads fighting over 1.5 CPUs of runtime across hard synchronisation barriers, and the spike
#   measured a single request failing to return in ten minutes at a sustained 800 % CPU. Pinning the
#   count is what makes `engineMs` a property of the engine rather than of whichever machine the
#   container happened to land on - which is the entire point of ADR-18's insistence that the
#   conditions be stated.
#
# The cost of pinning, measured in the spike: 1.906 s against 1.854 s at `--cpus=1.5` on the box,
# inside the noise of that measurement (IQR/median 10.4 % and 12.0 % respectively).

Global:
  text_score: 0.5

  use_det: true
  use_cls: true
  use_rec: true

  min_height: 30
  width_height_ratio: 8
  max_side_len: 2000
  min_side_len: 30

  return_word_box: false
  return_single_char_box: false

  font_path: null

EngineConfig:
  onnxruntime:
    # Changed from the packaged `-1`. Two intra-op threads match the deployment box's two cores
    # and the `cpus: 1.5` share it is given; one inter-op thread because the pipeline is
    # sequential - detection, then classification, then recognition - so a second does nothing
    # but contend.
    intra_op_num_threads: 2
    inter_op_num_threads: 1
    enable_cpu_mem_arena: false

    cpu_ep_cfg:
      arena_extend_strategy: 'kSameAsRequested'

    use_cuda: false
    cuda_ep_cfg:
      device_id: 0
      arena_extend_strategy: 'kNextPowerOfTwo'
      cudnn_conv_algo_search: 'EXHAUSTIVE'
      do_copy_in_default_stream: true

    use_dml: false
    dm_ep_cfg: null

    use_cann: false
    cann_ep_cfg:
      device_id: 0
      arena_extend_strategy: 'kNextPowerOfTwo'
      npu_mem_limit: 21474836480 # 20 * 1024 * 1024 * 1024
      op_select_impl_mode: 'high_performance'
      optypelist_for_implmode: 'Gelu'
      enable_cann_graph: true

  openvino:
    inference_num_threads: -1

  paddle:
    cpu_math_library_num_threads: -1
    use_cuda: false
    gpu_id: 0
    gpu_mem: 500

  torch:
    use_cuda: false
    gpu_id: 0

# The three model sections below are the image's defaults, restated here rather than inherited -
# phase 07 item 20. `model_type: "mobile"` is the lightweight variant the specification asks for;
# the server variants were measured on hardware that could hold them and are 30-150x slower for no
# accuracy gain on dates - docs/spikes/07-ocr-sidecar.md § 9. Because the values are written down, a
# future image that quietly ships something else shows up as a difference rather than as noise.

Det:
  engine_type: 'onnxruntime'
  lang_type: 'ch'
  model_type: 'mobile'
  ocr_version: 'PP-OCRv4'

  task_type: 'det'

  model_path: null
  model_dir: null

  limit_side_len: 736
  limit_type: min
  std: [0.5, 0.5, 0.5]
  mean: [0.5, 0.5, 0.5]

  thresh: 0.3
  box_thresh: 0.5
  max_candidates: 1000
  unclip_ratio: 1.6
  use_dilation: true
  score_mode: fast

Cls:
  engine_type: 'onnxruntime'
  lang_type: 'ch'
  model_type: 'mobile'
  ocr_version: 'PP-OCRv4'

  task_type: 'cls'

  model_path: null
  model_dir: null

  cls_image_shape: [3, 48, 192]
  cls_batch_num: 6
  cls_thresh: 0.9
  label_list: ['0', '180']

Rec:
  engine_type: 'onnxruntime'
  lang_type: 'ch'
  model_type: 'mobile'
  ocr_version: 'PP-OCRv4'

  task_type: 'rec'

  model_path: null
  model_dir: null

  rec_keys_path: null
  rec_img_shape: [3, 48, 320]
  rec_batch_num: 6
