# scanner.yo-po.eu - the benchmark harness.
#
# Installed to /etc/nginx/sites-available/scanner.yo-po.eu and symlinked into sites-enabled.
# It is committed even though it lives outside the repository on the box, because TLS for this
# service now depends on host configuration - ADR-17. An undocumented file on one box is how a
# certificate stops renewing and nobody knows why.
#
# The shape follows the `garden` vhost already on the box. The two deliberate differences are
# marked below; both matter, and neither is a stylistic preference.
#
# Deploy steps and the certbot invocation: deploy/README.md.

server {
    # The box runs nginx 1.24, where HTTP/2 is a listen parameter. The `http2 on;` directive is
    # 1.25.1 and later, and 1.24 rejects it as unknown - `nginx -t` fails outright rather than
    # warning. Worth having: the library grid fetches many thumbnails at once.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name scanner.yo-po.eu;

    ssl_certificate /etc/letsencrypt/live/scanner.yo-po.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scanner.yo-po.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/scanner.yo-po.eu.access.log;
    error_log /var/log/nginx/scanner.yo-po.eu.error.log;

    # Inherited by both locations below, so the two differ only in what actually differs.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A 16 MB upload over a phone connection is not instant, and the server-side OCR engines added
    # in phases 07-09 are slower still.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Deliberately low everywhere except the upload route. Nothing else in this API has a body
    # worth kilobytes.
    client_max_body_size 1m;

    # DIFFERENCE 1 from the garden vhost: the upload route accepts a full-resolution photo.
    # The box's other vhosts cap bodies at 8m, which a modern phone's original exceeds. The failure
    # mode is what makes this worth stating: nginx answers 413 on its own, so the request never
    # reaches the server and never appears in its log - phase 02 acceptance criterion 9.
    # Must stay >= MAX_UPLOAD_BYTES in server/.env, which is 32 MB.
    location = /api/v1/images {
        client_max_body_size 32m;
        proxy_pass http://127.0.0.1:3002;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
    }

    # DIFFERENCE 2 from the garden vhost: `proxy_pass` carries no URI component. With one, nginx
    # normalises the request URI before forwarding, which would decode `%2F` and turn a traversal
    # attempt into a path the server never gets to refuse. Without one, the URI is passed exactly
    # as the client sent it and the server's own ID validation is what answers - acceptance
    # criterion 5. Do not add a trailing path here.
}

server {
    listen 80;
    listen [::]:80;
    server_name scanner.yo-po.eu;

    # certbot's nginx authenticator injects the ACME challenge location into this block during a
    # renewal, exactly as it does for emerald and garden.
    return 301 https://$host$request_uri;
}
