packages:
  - 'app'
  - 'server'
  - 'packages/*'

# pnpm 10 blocks lifecycle scripts unless a dependency is named here. esbuild's postinstall places
# its native binary, so tsup cannot build without it. Every addition is a deliberate decision to run
# a third party's install script.
onlyBuiltDependencies:
  - esbuild
  # Native modules. better-sqlite3 compiles or downloads a prebuilt .node binding, sharp places the
  # libvips binary for the platform. Neither works if its install script is blocked.
  - better-sqlite3
  - sharp
